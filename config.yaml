data:
  data_dir: ./datasets/raw_data
  csv_glob: "*.csv"
  # Glob patterns to exclude (whole_session CSVs duplicate the individual rep CSVs)
  # Patterns matched against EVERY path component (filename + parent folders).
  # *whole_session* = skip duplicated whole-session CSVs
  # *_w            = skip corrupted sets (folder names ending with _w)
  exclude_patterns: ["*whole_session*", "*_w", "*rest_after*"]
  # All 8 actions for comprehensive evaluation.
  # Previously was [db_bench_press, db_rdl, db_weighted_crunch, one_arm_db_row]
  # Expanded to all actions after config bug fix (sample_rate_hz was 50 not 100).
  include_actions:
    - db_bench_press
    - db_biceps_curl
    - db_rdl
    - db_shoulder_press
    - db_squat
    - db_triceps_curl
    - db_weighted_crunch
    - one_arm_db_row

io:
  output_dir: ./artifacts/action_classification
  phase_output_dir: ./artifacts/phase_segmentation
  rep_segmentation_output_dir: ./artifacts/rep_segmentation

feature:
  imu_columns: [ax, ay, az, gx, gy, gz]
  label_column: action_type
  subject_column: subject_id
  time_column: sensor_ts

window:
  sample_rate_hz: 100  # FIXED: was 50, data is ~100 Hz
  window_seconds: 1.5
  stride_seconds: 0.5

micro_macro:
  # Rep Segmentation post-processing parameters.
  # FIXED: These were missing in config.yaml, causing catastrophic over-segmentation.
  min_rep_duration_seconds: 1.2
  min_rep_confidence: 0.0
  max_phase_gap_samples: 3
  min_phase_samples: 3

model:
  input_channels: 6
  num_classes: 8
  patch_size: 10
  embed_dim: 128
  depth: 2
  num_heads: 4
  mlp_ratio: 2
  dropout: 0.1

train:
  seed: 42
  batch_size: 64
  epochs: 30
  lr: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  device: cpu

autogluon:
  # Feature extraction for each IMU window:
  # - stats: per-channel summary statistics (fast, small feature dim)
  # - flatten: raw window flattened to a long vector (higher dim)
  # - rich: stats + RMS + IQR + ZCR + autocorrelation + FFT + inter-axis correlation
  feature_mode: rich  # stats | flatten | rich

  # AutoGluon presets control training quality vs speed.
  # Common choices: medium_quality_faster_train, high_quality, best_quality
  # NOTE: best_quality + bagging + stacking can use 20GB+ RAM on small machines.
  #       Start with medium, then try high_quality once baseline is verified.
  presets: medium_quality_faster_train

  # Wall-clock budget (seconds) for model search.
  time_limit_s: 600

  # Metric used for model selection.
  eval_metric: accuracy

  # Optionally limit CPU usage (null = AutoGluon default).
  num_cpus: null

  # Memory limit in GB (null = no limit). Set to ~60-70% of total RAM.
  memory_limit_gb: 4

  # Model family filtering (null = use all AutoGluon defaults).
  # Examples: GBM, CAT, XGB, RF, XT, KNN, LR, NN_TORCH, FASTAI
  included_model_types: null
  # Exclude heavy neural-net models to save memory on local machines.
  # Also exclude GBM (LightGBM) and XGB — segfault on macOS ARM64 (OpenMP issue).
  # Remaining: CAT, RF, XT, KNN, LR
  excluded_model_types: [NN_TORCH, FASTAI, GBM, XGB]

  # Bagging folds (0 = disabled). Use 5-10 for better generalization.
  # WARNING: each fold multiplies memory usage. Start with 0.
  num_bag_folds: 0

  # Stacking levels (0 = disabled, 1 = single stack for ensembling).
  # WARNING: stacking requires bagging and multiplies memory further.
  num_stack_levels: 0

distill:
  # Knowledge distillation from AutoGluon teacher to student transformer.
  # Temperature: higher = softer probability distributions.
  temperature: 3.0
  # Alpha: weight of soft-label KL loss vs hard-label CE loss.
  # alpha * KL_soft + (1 - alpha) * CE_hard
  alpha: 0.7
  epochs: 50

phase:
  # Per-rep phase segmentation model.
  # Intended inference order: rep segmentation first, then eccentric/concentric
  # phase cutting inside each cropped rep.
  window_seconds: 0.6
  stride_seconds: 0.1
  feature_mode: rich
  presets: medium_quality_faster_train
  time_limit_s: 600
  eval_metric: f1_macro
  num_cpus: null
  included_model_types: null
  excluded_model_types: [NN_TORCH, FASTAI, GBM, XGB]
  num_bag_folds: 0
  num_stack_levels: 0

segmentation:
  # Single-exemplar SDTW repetition segmentation.
  # This first stage detects active rep boundaries where
  # phase is eccentric/concentric; phase-transition slicing is evaluated next.
  sdtw:
    # Include accelerometer, gyroscope, and magnetometer axes for template matching.
    motion_columns: [ax, ay, az, gx, gy, gz, mx, my, mz]
    smoothing_window: 9
    min_point_gap: 8
    point_value_epsilon: 0.08
    min_scale_percent: 0.55
    threshold_percentile: 60.0
    threshold_margin: 0.02
    duration_min_ratio: 0.55
    duration_max_ratio: 1.75
    max_overlap_iou: 0.20
    max_candidates_per_endpoint: 30
    # Prefer middle reps for the exemplar/template; early and late reps can be unstable.
    template_middle_fraction: 0.50
    template_min_edge_reps: 1
    max_templates: 3
