data:
  data_dir: ./datasets/raw_data
  csv_glob: "*.csv"
  exclude_patterns: ["*whole_session*", "*_w", "*rest_after*"]
  include_actions: [db_bench_press, db_rdl, db_weighted_crunch, one_arm_db_row]

io:
  micro_macro_output_dir: ./artifacts/micro_macro_recognition

feature:
  imu_columns: [ax, ay, az, gx, gy, gz]
  label_column: action_type
  subject_column: subject_id
  time_column: sensor_ts

window:
  sample_rate_hz: 100

train:
  seed: 42
  batch_size: 32
  epochs: 20
  lr: 0.0003
  weight_decay: 0.00001
  test_subject: kevin
  device: auto
  num_workers: auto
  pin_memory: auto
  amp: true

micro_macro:
  micro_source: both
  train_on_modes: [sets, whole]
  slice_seconds: 20.0
  overlap: 0.50
  num_filters: 64
  num_layers: 6
  kernel_size: 3
  dropout: 0.2
  causal: true
  num_macro_stages: 3
  alpha: 1.0
  beta: 0.0
  tmse_threshold: 4.0
  max_phase_gap_samples: 3
  min_phase_samples: 3
  min_rep_duration_seconds: 1.2
  min_rep_confidence: 0.0
  resample_to_window_rate: true
  plot_max_streams: 24

  dtw:
    smoothing_window: 7
    duration_min_ratio: 0.55
    duration_max_ratio: 1.75
    threshold_percentile: 75.0
    threshold_margin: 0.10
    detection_stride: 8
    duration_stride: 8
    dtw_downsample_factor: 2
    max_windows_per_label: 5000
    max_overlap_iou: 0.20
