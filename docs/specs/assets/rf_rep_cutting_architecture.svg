<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>
    <linearGradient id="refinerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e8ff"/>
      <stop offset="100%" style="stop-color:#e9d5ff"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="perActionBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#16a34a"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowStrong" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="48" fill="url(#headerGrad)"/>
  <text x="450" y="30" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">目前主線：Action-Conditioned RF + Boundary Refiner</text>

  <!-- Per-action label -->
  <rect x="30" y="62" width="840" height="28" rx="6" fill="url(#perActionBanner)" filter="url(#shadowStrong)"/>
  <text x="450" y="81" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Per-Action 模型：每個動作獨立訓練一組 RF + Refiner</text>

  <!-- ===== Step 1: Input ===== -->
  <text x="450" y="120" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700" letter-spacing="1">步驟 1：輸入前處理</text>

  <rect x="100" y="132" width="700" height="64" rx="10" fill="url(#inputGrad)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="154" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="600">6 軸 IMU 原始訊號</text>
  <text x="200" y="178" text-anchor="middle" fill="#0ea5e9" font-size="11">ax, ay, az, gx, gy, gz</text>
  <text x="540" y="178" text-anchor="middle" fill="#0ea5e9" font-size="11">+ train-fold z-score 正規化</text>
  <text x="450" y="190" text-anchor="middle" fill="#64748b" font-size="10">window_size=50, stride=10</text>

  <!-- Arrow -->
  <line x1="450" y1="196" x2="450" y2="218" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 2: Causal RF Phase Detector ===== -->
  <text x="450" y="240" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700" letter-spacing="1">步驟 2：Causal RF 向心 / 離心 Phase 預測</text>

  <rect x="100" y="252" width="700" height="78" rx="10" fill="url(#modelGrad)" stroke="#16a34a" stroke-width="2" filter="url(#shadowStrong)"/>
  <text x="450" y="274" text-anchor="middle" fill="#166534" font-size="14" font-weight="700">Random Forest Phase Detector</text>
  <text x="450" y="294" text-anchor="middle" fill="#16a34a" font-size="11">每個時間點預測三類 phase 機率</text>
  <text x="250" y="314" text-anchor="middle" fill="#166534" font-size="12">concentric（向心）</text>
  <text x="450" y="314" text-anchor="middle" fill="#166534" font-size="12">eccentric（離心）</text>
  <text x="660" y="314" text-anchor="middle" fill="#166534" font-size="12">other（靜止 / 休息）</text>

  <!-- Hyperparams note -->
  <rect x="300" y="334" width="300" height="18" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="450" y="347" text-anchor="middle" fill="#166534" font-size="10">n_estimators=50, max_depth=15, max_samples=0.7, n_jobs=-1</text>

  <!-- Arrow -->
  <line x1="450" y1="352" x2="450" y2="374" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 3: Phase Decoder + Rep Pairing ===== -->
  <text x="450" y="396" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700" letter-spacing="1">步驟 3：Phase 解碼與 Rep 配對</text>

  <rect x="100" y="408" width="700" height="60" rx="10" fill="url(#decoderGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="430" text-anchor="middle" fill="#92400e" font-size="13" font-weight="600">固定規則配對：concentric → eccentric → Rep</text>
  <text x="450" y="452" text-anchor="middle" fill="#d97706" font-size="11">粗估 rep 邊界（start / transition / end）</text>
  <text x="450" y="466" text-anchor="middle" fill="#f59e0b" font-size="10">若 phase 順序錯誤或缺少其中一段則丟棄</text>

  <!-- Arrow -->
  <line x1="450" y1="468" x2="450" y2="490" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 4: Boundary Refiner ===== -->
  <text x="450" y="512" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700" letter-spacing="1">步驟 4：Boundary Refiner 邊界修正</text>

  <rect x="100" y="524" width="700" height="60" rx="10" fill="url(#refinerGrad)" stroke="#9333ea" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="546" text-anchor="middle" fill="#6b21a8" font-size="13" font-weight="600">ExtraTrees Regressor × 3</text>
  <text x="450" y="568" text-anchor="middle" fill="#9333ea" font-size="11">分別修正：rep_start / rep_transition / rep_end</text>
  <text x="450" y="582" text-anchor="middle" fill="#a855f7" font-size="10">edge_window=20, 以粗估 rep 邊界周圍區域特徵作為輸入</text>

  <!-- Arrow -->
  <line x1="450" y1="584" x2="450" y2="606" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Step 5: Output ===== -->
  <text x="450" y="628" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700" letter-spacing="1">步驟 5：輸出</text>

  <rect x="100" y="640" width="700" height="36" rx="10" fill="url(#outputGrad)" stroke="#db2777" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="663" text-anchor="middle" fill="#9d174d" font-size="12" font-weight="600">最終 Rep：開始點 / 轉折點 / 結束點</text>
  <text x="500" y="663" text-anchor="middle" fill="#db2777" font-size="11">rep count / rep F1 / MAE</text>
  <text x="700" y="663" text-anchor="middle" fill="#db2777" font-size="11">exact-count / over / under</text>

</svg>